version: "3.8"
# Stack para Portainer - CRM com serviços externos (PostgreSQL e Redis)
# Com suporte a WhatsApp Cloud API (Meta) e ligações (API oficial e QR/whatsmeow)

# IMPORTANTE: Certifique-se que a rede 'SUA_REDE' existe e o Traefik está nela
# IMPORTANTE: No Portainer, crie a stack em um ambiente do tipo SWARM (não Standalone),
#             senão os labels do Traefik em "deploy:" são ignorados.
#
# ============================================
# LIGAÇÕES - CHECKLIST
# ============================================
# 1) Troque IP_DA_VPS pelo IP PÚBLICO do servidor (no whats-service e no wa-call-gateway).
# 2) Libere no firewall da VPS (ufw/iptables) E no painel do provedor (security group):
#      UDP 30000-30100  -> wa-call-gateway (ligações da API oficial)
#      UDP 30200-30300  -> whats-service   (ligações do WhatsApp QR)
# 3) API oficial: no painel da Meta, ative "Calling" no número e inscreva o
#    webhook também no campo "calls" (além de "messages").
# 4) No CRM, a empresa precisa estar com o módulo de ligações habilitado.
# 5) Swarm com MAIS DE UM nó: o whats-service e o wa-call-gateway precisam rodar
#    no nó do IP_DA_VPS (veja "placement" nesses serviços).

services:
  crm_api:
    image: inovanode/sofiacrm-pro:latest
    container_name: crm_api
    restart: always
    environment:
      # Database - Use DATABASE_URL ou configure individualmente
      DATABASE_URL: postgresql://postgres:SENHA_DO_POSTGRES@pgvector:5432/crm
      
      # Redis - Use REDIS_URL com senha incluída (recomendado)
      REDIS_URL: redis://:SENHA_DO_REDIS@redis:6379
      
      # Application
      INSTANCE_ROLE: api
      NODE_ENV: production
      PORT: 3000
      MEDIA_DIR: /app/media

      # Storage de mídia:
      # --- Storage de mídia (local ou s3) ---
      STORAGE_TYPE: local

      # AWS S3 (produção AWS padrão)
      #AWS_REGION: 
      #AWS_S3_BUCKET_NAME: 
      #AWS_ACCESS_KEY_ID: 
      #AWS_SECRET_ACCESS_KEY: 

      # Suporte para S3 compatível (MinIO/Spaces/R2)
      #AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      #AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
      
      # Security - IMPORTANTE: Use valores únicos e seguros
      JWT_SECRET: SEU_JWT_TOKEN
      INTERNAL_WEBHOOK_TOKEN: INTERNAL_WEBHOOK_TOKEN
      
      # Features
      CONTACTS_UPDATE_INTERVAL_HOURS: 1
      CONTACTS_UPDATE_BATCH_SIZE: 100
      LOG_LEVEL: INFO
      DISABLE_TRIAL_REGISTRATION: 1
      APP_LOCALE: pt-BR
      API_TOKEN_RATE_LIMIT_MAX: 100      # Requisições por minuto por token de integração (tk_xxx)
      
      # ============================================
      # OBRIGATÓRIAS PARA VERSÃO PRO - Licença
      # ============================================
      LICENSE_TOKEN: SEU_TOKEN_DA_LICENÇA

      # ============================================
      # LIGAÇÕES WHATSAPP (API oficial e QR)
      # ============================================
      # Liga o módulo de ligações na stack (padrão já é ligado; 0 desliga)
      MODULE_WHATSMEOW_CALLS_FEATURE_ENABLED: 1
      # Endereço interno do wa-call-gateway (áudio das ligações da API oficial)
      CALL_GATEWAY_URL: http://wa-call-gateway:8091
      
      # ============================================
      # WHATSAPP CLOUD API (META) - NOVO!
      # ============================================
      # URL interna do serviço meta-cloud-service (comunicação dentro da rede Docker)
      META_CLOUD_SERVICE_URL: http://meta-cloud-service:8090
      
      # Token para comunicação service-to-service (CRM <-> Meta Cloud Service)
      # IMPORTANTE: Use o mesmo valor no crm_api, crm_worker e meta-cloud-service!
      # Gere um token forte via ssh: openssl rand -hex 32 
      # Gere um token forte pelo site: https://www.hexhero.com/tools/random-key-generator Selecione Hexadecimal em Options e Key Strength 32 Bytes.
      # Exemplo: 6d2b956c30ea7f07039fb3d9e0f7f21b8e6f3b63cbb5aaecf0e12d901d79c6ec
      META_CLOUD_SERVICE_TOKEN: META_CLOUD_SERVICE_TOKEN
      
      # URL pública do CRM (OBRIGATÓRIO para mídia via Cloud API)
      # A Meta usa essa URL para baixar arquivos de mídia do seu servidor
      # Exemplo https://app.sofiacrm.com.br
      PUBLIC_BASE_URL: https://URL_DO_CRM
    
    volumes:
      - media_data:/app/media
    
    networks:
      - SUA_REDE
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Porta exposta (opcional se usar apenas Traefik)
    ports:
      - "3000:3000"
    
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=SUA_REDE"
        - "traefik.http.routers.crm_api.rule=Host(`URL_DO_CRM`)"
        - "traefik.http.routers.crm_api.entrypoints=websecure"
        - "traefik.http.routers.crm_api.priority=1"
        - "traefik.http.routers.crm_api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.crm_api.service=crm_api"
        - "traefik.http.services.crm_api.loadbalancer.server.port=3000"

  crm_worker:
    image: inovanode/sofiacrm-pro:latest
    command: ["node", "dist/worker-entry.js"]
    restart: always
    environment:
      # Database - Use DATABASE_URL ou configure individualmente
      DATABASE_URL: postgresql://postgres:SENHA_DO_POSTGRES@pgvector:5432/crm
      
      # Redis - Use REDIS_URL com senha incluída (recomendado)
      REDIS_URL: redis://:SENHA_DO_REDIS@redis:6379
      
      # Application
      INSTANCE_ROLE: worker
      NODE_ENV: production
      PORT: 3000
      MEDIA_DIR: /app/media

      # Storage de mídia:
      # --- Storage de mídia (local ou s3) ---
      STORAGE_TYPE: local

      # AWS S3 (produção AWS padrão)
      #AWS_REGION: 
      #AWS_S3_BUCKET_NAME: 
      #AWS_ACCESS_KEY_ID: 
      #AWS_SECRET_ACCESS_KEY: 

      # Suporte para S3 compatível (MinIO/Spaces/R2)
      #AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      #AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
      
      # Security - IMPORTANTE: Use valores únicos e seguros
      JWT_SECRET: SEU_JWT_TOKEN
      INTERNAL_WEBHOOK_TOKEN: INTERNAL_WEBHOOK_TOKEN
      
      # Features
      CONTACTS_UPDATE_INTERVAL_HOURS: 1
      CONTACTS_UPDATE_BATCH_SIZE: 100
      LOG_LEVEL: INFO
      DISABLE_TRIAL_REGISTRATION: 1
      APP_LOCALE: pt-BR
      API_TOKEN_RATE_LIMIT_MAX: 100      # Requisições por minuto por token de integração (tk_xxx)
      
      # ============================================
      # OBRIGATÓRIAS PARA VERSÃO PRO - Licença
      # ============================================
      LICENSE_TOKEN: SEU_TOKEN_DA_LICENÇA

      # ============================================
      # LIGAÇÕES WHATSAPP (API oficial e QR) - iguais ao crm_api
      # ============================================
      MODULE_WHATSMEOW_CALLS_FEATURE_ENABLED: 1
      CALL_GATEWAY_URL: http://wa-call-gateway:8091
      
      # ============================================
      # WHATSAPP CLOUD API (META) - NOVO!
      # ============================================
      # URL interna do serviço meta-cloud-service (comunicação dentro da rede Docker)
      META_CLOUD_SERVICE_URL: http://meta-cloud-service:8090
      
      # Token para comunicação service-to-service (CRM <-> Meta Cloud Service)
      # IMPORTANTE: Use o mesmo valor no crm_api, crm_worker e meta-cloud-service!
      # Gere um token forte via ssh: openssl rand -hex 32 
      # Gere um token forte pelo site: https://www.hexhero.com/tools/random-key-generator Selecione Hexadecimal em Options e Key Strength 32 Bytes.
      # Exemplo: 6d2b956c30ea7f07039fb3d9e0f7f21b8e6f3b63cbb5aaecf0e12d901d79c6ec
      META_CLOUD_SERVICE_TOKEN: META_CLOUD_SERVICE_TOKEN
      
      # URL pública do CRM (OBRIGATÓRIO para mídia via Cloud API)
      # A Meta usa essa URL para baixar arquivos de mídia do seu servidor
      # Exemplo https://app.sofiacrm.com.br
      PUBLIC_BASE_URL: https://URL_DO_CRM
      
    volumes:
      - media_data:/app/media
      
    networks:
      - SUA_REDE
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G

  whats-service:
    image: inovanode/sofiacrm-whats-service-pro:latest
    container_name: crm_whatsmeow
    restart: always
    environment:
      CRM_API_URL: http://crm_api:3000
      INTERNAL_WEBHOOK_TOKEN: INTERNAL_WEBHOOK_TOKEN  #Igual o INTERNAL_WEBHOOK_TOKEN do serviço crm_api
      STORE_PATH: /app/data
      WHATSAPP_DEVICE_NAME: whatsapp

      # --- WhatsApp (whatsmeow-service) - Presence pulse (opcional) ---
      # Ativa/desativa o “pulso de presença” para manter a sessão do WhatsApp “quente” sem enviar mensagens.
      #WHATSAPP_PRESENCE_PULSE_ENABLED: 1
      # Intervalo entre pulsos de presença (ex.: 12h).
      #WHATSAPP_PRESENCE_PULSE_INTERVAL: 12
      # Duração de cada pulso (tempo alternando presença) (ex.: 15s).
      #WHATSAPP_PRESENCE_PULSE_DURATION: 1
      # Atraso inicial após iniciar o serviço antes do primeiro pulso (ex.: 60s).
      #WHATSAPP_PRESENCE_PULSE_START_DELAY: 60
      # Variação aleatória aplicada ao intervalo para evitar padrão fixo (ex.: 60s).
      #WHATSAPP_PRESENCE_PULSE_JITTER: 60

      # Objetivo: antes do contato receber a mensagem, mostrar "digitando..." (texto) ou "gravando áudio..." (PTT).
      # Ativa/desativa (1/0) mostrar “digitando…” antes de enviar mensagens de texto (adiciona latência).
      #WHATSAPP_PRESENCE_BEFORE_TEXT_ENABLED: 1
      # Duração do “digitando…” antes do envio (ex.: 3s).
      #WHATSAPP_PRESENCE_BEFORE_TEXT_DURATION: 3
      # Ativa/desativa (1/0) mostrar “gravando áudio…” antes de enviar PTT/áudio (adiciona latência).
      #WHATSAPP_PRESENCE_BEFORE_AUDIO_ENABLED: 1
      # Duração do “gravando áudio…” antes do envio (ex.: 3s).
      #WHATSAPP_PRESENCE_BEFORE_AUDIO_DURATION: 3

      # ============================================
      # LIGAÇÕES VIA WHATSAPP (QR)
      # ============================================
      WHATSMEOW_CALLS_ENABLED: 1
      # Faixa de portas UDP do áudio. Tem que bater com "ports" abaixo e com o firewall.
      WHATSMEOW_ICE_UDP_MIN: 30200
      WHATSMEOW_ICE_UDP_MAX: 30300
      # IP PÚBLICO do servidor (o mesmo do GATEWAY_PUBLIC_IP).
      # Sem ele o serviço tenta descobrir o IP sozinho; se falhar, anuncia só
      # endereços internos do Docker e a ligação fica MUDA.
      WHATSMEOW_PUBLIC_IP: IP_DA_VPS

    ports:
      - "30200-30300:30200-30300/udp"
      - "30200-30300:30200-30300/tcp"
      
    volumes:
      - whatsmeow_data:/app/data
    networks:
      - SUA_REDE
    depends_on:
      - crm_api
    deploy:
      replicas: 1
      # Swarm com mais de um nó: descomente para rodar no nó do IP_DA_VPS
      #placement:
      #  constraints: [node.hostname == NOME_DO_NO]

  # ============================================
  # META CLOUD SERVICE - WhatsApp Cloud API
  # ============================================
  # Este serviço gerencia a comunicação com a API oficial do WhatsApp (Meta)
  # Permite usar números verificados via WhatsApp Business API
  # Ligações da API oficial: ative "Calling" no número (painel da Meta) e
  # inscreva o webhook também no campo "calls".
  meta-cloud-service:
    image: inovanode/sofia-meta-cloud-service-pro:latest
    container_name: crm_meta_cloud
    restart: always
    environment:
      # URL do CRM API para comunicação interna
      CRM_API_URL: http://crm_api:3000
      
      # Token de autenticação service-to-service
      # CRÍTICO: Deve ser EXATAMENTE o mesmo valor do META_CLOUD_SERVICE_TOKEN no crm_api
      # Gere um token forte via ssh: openssl rand -hex 32 
      # Gere um token forte pelo site: https://www.hexhero.com/tools/random-key-generator Selecione Hexadecimal em Options e Key Strength 32 Bytes.
      # Exemplo: 6d2b956c30ea7f07039fb3d9e0f7f21b8e6f3b63cbb5aaecf0e12d901d79c6ec
      META_CLOUD_SERVICE_TOKEN: META_CLOUD_SERVICE_TOKEN
      
      # Porta interna do serviço
      PORT: 8090
    
    networks:
      - SUA_REDE
    
    depends_on:
      - crm_api
    
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=SUA_REDE"
        
        # ============================================
        # Rota 1: Webhook público (Meta -> seu servidor)
        # A Meta envia mensagens e eventos de ligação recebidos para esta URL
        # ============================================
        - "traefik.http.routers.meta_webhook.rule=Host(`URL_DO_CRM`) && PathPrefix(`/api/webhooks/meta/whatsapp`)"
        - "traefik.http.routers.meta_webhook.entrypoints=websecure"
        - "traefik.http.routers.meta_webhook.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.meta_webhook.priority=20"
        - "traefik.http.routers.meta_webhook.service=meta_cloud"
        
        # ============================================
        # Rota 2: API interna (CRM -> Meta Cloud Service)
        # Usada internamente para enviar mensagens e templates
        # ============================================
        - "traefik.http.routers.meta_cloud.rule=Host(`URL_DO_CRM`) && PathPrefix(`/api/meta-cloud`)"
        - "traefik.http.routers.meta_cloud.entrypoints=websecure"
        - "traefik.http.routers.meta_cloud.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.meta_cloud.priority=20"
        - "traefik.http.routers.meta_cloud.service=meta_cloud"
        
        # Porta do serviço
        - "traefik.http.services.meta_cloud.loadbalancer.server.port=8090"

  # ============================================
  # WA CALL GATEWAY - áudio das ligações da API oficial
  # ============================================
  wa-call-gateway:
    image: inovanode/sofiacrm-gateway:latest
    restart: always
    environment:
      PORT: 8091
      # Faixa de portas UDP do áudio. Tem que bater com "ports" abaixo e com o firewall.
      GATEWAY_UDP_MIN: 30000
      GATEWAY_UDP_MAX: 30100
      # IP PÚBLICO do servidor. Sem ele a ligação atende mas fica MUDA.
      GATEWAY_PUBLIC_IP: IP_DA_VPS
      CRM_API_URL: http://crm_api:3000
      INTERNAL_WEBHOOK_TOKEN: INTERNAL_WEBHOOK_TOKEN #Igual o INTERNAL_WEBHOOK_TOKEN do serviço crm_api
    ports:
      - "30000-30100:30000-30100/udp"
      - "30000-30100:30000-30100/tcp"
    networks:
      - SUA_REDE
    depends_on:
      - crm_api
    deploy:
      replicas: 1
      # Swarm com mais de um nó: descomente para rodar no nó do IP_DA_VPS
      #placement:
      #  constraints: [node.hostname == NOME_DO_NO]

volumes:
  whatsmeow_data:
    driver: local
  media_data:
    driver: local

networks:
  SUA_REDE:
    external: true
    name: SUA_REDE
